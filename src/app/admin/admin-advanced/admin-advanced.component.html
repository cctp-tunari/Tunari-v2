<div class="container mt-4">
  <h3>Gestión de Administradores</h3>

  <div class="form-group my-3">
    <input [(ngModel)]="newAdminEmail" type="email" class="form-control" placeholder="Correo del nuevo administrador" />
    <button class="btn btn-primary mt-2" (click)="addAdmin()"
      [disabled]="isLoading || !isValidEmail(newAdminEmail)">Agregar</button>
  </div>

  <div *ngIf="statusMessage" class="alert alert-info alert-dismissible fade show" role="alert">
    {{ statusMessage }}
    <button type="button" class="btn-close" aria-label="Close" (click)="statusMessage = ''"></button>
  </div>

  <table class="table table-bordered table-striped mt-4">
    <thead>
      <tr>
        <th>Email</th>
        <th>Permisos Super Admin</th>
        <th>Creado</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let admin of admins">
        <td>{{ admin.email }}</td>
        <!-- <td>{{ admin.uid }}</td> -->
        <td>
          <div class="form-check form-switch d-inline-block align-middle">
            <input class="form-check-input" type="checkbox" [checked]="admin.superAdmin"
              (change)="toggleSuperAdmin(admin.uid, $event)" />
            <label class="form-check-label ms-1">
              {{ admin.superAdmin ? 'Super' : 'Básico' }}
            </label>
          </div>
        </td>
        <td>{{ admin.createdAt | date: 'short' }}</td>
        <td>
          <button class="btn btn-danger btn-sm" (click)="confirmDeleteAdmin(admin.uid, admin.email)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
