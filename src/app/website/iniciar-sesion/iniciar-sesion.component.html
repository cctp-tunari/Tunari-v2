<div class="header">
  <img src="cochabamba-portada.jpg" class="img-fluid" alt="">
  <div class="overlay">
    <div class="login-container">
      <h5>Iniciar Sesión</h5>

      <!-- Condicional: formulario de login o recuperación -->
      <form *ngIf="!resetMode" (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" [(ngModel)]="email" name="username" required placeholder="ejemplo@email.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit">Iniciar Sesión</button>
      </form>

      <!-- Formulario de recuperación de contraseña -->
      <form *ngIf="resetMode" (ngSubmit)="sendPasswordReset()">
        <div class="form-group">
          <label for="resetEmail">Correo para recuperación</label>
          <input type="email" id="resetEmail" [(ngModel)]="email" name="resetEmail" required placeholder="ejemplo@email.com">
        </div>
        <button type="submit">Enviar correo de recuperación</button>
        <p><a href="#" (click)="resetMode = false; $event.preventDefault();">← Volver al inicio de sesión</a></p>
      </form>

      <!-- Enlace para activar modo recuperación -->
      <p *ngIf="!resetMode">
        <a href="#" (click)="resetMode = true; $event.preventDefault();">¿Olvidaste tu contraseña?</a>
      </p>
    </div>
  </div>
</div>

<!-- Mensaje de alerta -->
<div *ngIf="message" class="alert alert-info alert-dismissible fade show alert-top" role="alert">
  {{ message }}
  <button type="button" class="btn-close" (click)="message = ''" aria-label="Close"></button>
</div>
